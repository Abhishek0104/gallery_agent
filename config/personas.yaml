# Persona outline sampling. Quotas are exact counts (largest remainder), not per-persona dice rolls.
n_personas: 20
seed: 7

quotas:
  region:    {india: 0.50, us: 0.20, uk: 0.10, australia: 0.05, canada: 0.05, singapore: 0.05, uae: 0.05}
  household: {young_family: 0.25, couple: 0.15, single: 0.15, student: 0.10,
              parents_of_adults: 0.15, multigenerational: 0.20}
  pet:       {named: 0.50, unnamed: 0.20, none: 0.30}
  # Unusual name shapes, to exercise span copying. One per persona where not "none".
  tricky_name: {none: 0.40, two_word: 0.15, hyphenated: 0.15, apostrophe: 0.10,
                nickname: 0.10, long: 0.10}

pet_species: {dog: 0.55, cat: 0.35, rabbit: 0.05, parrot: 0.05}   # sampled, not quota'd

people: {min: 3, max: 7}      # excluding the owner

# Household templates. Roles map to canonical relations in persona_outline.py.
# `group` = the role that gets 2+ people with the same relation word (exercises OR-within-element).
# Counts are [min, max]; optional roles are trimmed first if the total exceeds people.max.
households:
  young_family:      {age: [28, 42], group: child,  roles: {spouse: [1, 1], child: [2, 2], parent: [0, 2], sibling: [0, 1], friend: [1, 2]}}
  couple:            {age: [25, 40], group: friend, roles: {spouse: [1, 1], friend: [2, 3], parent: [0, 2], sibling: [0, 1]}}
  single:            {age: [23, 38], group: friend, roles: {friend: [2, 3], parent: [0, 2], sibling: [0, 1], colleague: [0, 1]}}
  student:           {age: [18, 24], group: friend, roles: {friend: [2, 3], parent: [1, 2], sibling: [0, 1], roommate: [0, 1]}}
  parents_of_adults: {age: [48, 66], group: child,  roles: {spouse: [1, 1], child: [2, 2], grandchild: [0, 1], sibling: [0, 1], friend: [0, 1]}}
  multigenerational: {age: [32, 52], group: child,  roles: {spouse: [1, 1], child: [2, 2], parent: [1, 2], grandparent: [0, 1], cousin: [0, 1]}}
