# Export (docs/export_design.md). Only verifier-accepted episodes are exported.
version: e2e_v1
# episodes_<episodes>.jsonl + verified_<episodes>.jsonl; eval ids are written per spec tag (for realize.run --tag)
sources:
  - {episodes: v2, specs: v2}
  - {episodes: r2, specs: r2}

# Eval = every episode of these personas (never seen in training). Chosen to cover regions (2 India, 1 US,
# 1 other), households and tricky names: hyphen (Abdul-Karim), apostrophe (Rif'at), two-word (John Luke, Wei Jie).
held_out_personas: [persona_04, persona_17, persona_19, persona_20]

# Rendering for the base model (export/render_check.py, train/sft_lora.py)
base_model: Qwen/Qwen3.5-0.8B
chat_template_kwargs: {enable_thinking: false}   # non-thinking mode, identical at training and inference
