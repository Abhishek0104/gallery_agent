# Spec sampler (v0 = happy path only). Quotas are exact counts over the batch (largest remainder).
n_specs: 50
seed: 11

# Search slot patterns (docs/intent_filler_design.md §5). Leans on people and location.
slot_patterns:
  people+query:           0.20
  people+location:        0.15
  query:                  0.15
  location:               0.12
  people:                 0.12
  location+date:          0.12
  people+location+query:  0.10
  people+location+query+date: 0.04

# people slot: 1 element (AND across elements when 2)
people_elements: {1: 0.75, 2: 0.25}
people_kind: {name: 0.40, relation: 0.30, me: 0.20, pet: 0.10}   # pet only if the persona has a named pet

location_source: {places_visited: 0.80, home_city: 0.20}

# Date phrases: region phrases/festivals from config/regions.yaml, plus these generic ones.
date_source: {generic: 0.60, region: 0.40}
generic_dates: [last month, last weekend, last year, last summer, yesterday, two weeks ago,
                this year, last December, in 2023, back in 2022, over New Year]
# no personal events ("my birthday", "our anniversary"): they are photo content and go in query

query_length: {short: 0.40, medium: 0.40, long: 0.20}
query_examples: 3            # pool examples shown to the filler for the sampled category

# Happy-path counts
counts:
  search: [1, 40]            # intersected with whatever downstream steps need
  ask: [1, 4]                # ask_gallery returns at most top_k images
  initial_selection: [1, 20]
album_exists: 0.5            # move_to_album into an existing persona album vs a new one
effects_shown: [2, 4]        # how many of the registry effects this episode's prompt lists (random order)

# User-turn grouping; forced boundaries (before a selection, after ask_gallery, between refinement
# searches) always apply.
turn_mode: {one_message: 0.40, one_per_turn: 0.30, mixed: 0.30}

# ask_gallery question types. Before an action the question must surface photos to act on.
ask_types:
  standalone: [document_fact, count, when, yes_no, what]
  before_action: [yes_no, when, what]
