# LLM client config — read only by llm.py.
# Each role picks its own provider and model, so judges can run on a different model later.
# Responses are cached on disk, keyed by (provider, model, thinking, system, prompt, schema, seed).
#
# thinking: one knob, mapped per provider
#   gemini    -> thinking_level: minimal | low | medium | high
#   anthropic -> effort:         low | medium | high | xhigh | max
# Credentials come from the environment: GEMINI_API_KEY (or GOOGLE_API_KEY) / ANTHROPIC_API_KEY.
cache_dir: data/cache/llm

roles:
  generation:               # personas, query pool, intent filler, user simulator, teacher
    provider: gemini
    model: gemini-3-pro-preview
    thinking: high
    max_tokens: 16000
  judge:                    # later: faithfulness / naturalness / query-purity judges
    provider: null          # pick a different model than generation when judges are built
    model: null

anthropic:
  fallbacks: default        # server-side refusal fallback (beta); null to disable
