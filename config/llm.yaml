# LLM client config — read only by llm.py.
# Each role picks its own provider and model, so judges can run on a different model later.
# Responses are cached on disk, keyed by (provider, model, thinking, system, prompt, schema, seed).
#
# thinking: one knob, mapped per provider
#   gemini    -> thinking_level: minimal | low | medium | high
#   anthropic -> effort:         low | medium | high | xhigh | max
# Credentials come from the environment: GEMINI_API_KEY (or GOOGLE_API_KEY) / ANTHROPIC_API_KEY.
cache_dir: data/cache/llm

roles:
  generation:               # personas, query pool (kept on this model so reruns hit the cache)
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking: high
    max_tokens: 16000
  filler:                   # intent filler (and later the other high-volume stages); own rate limit
    provider: gemini
    model: gemini-3.8-flash
    thinking: high
    max_tokens: 16000
  user_sim:                 # dialogue realization: plays the owner
    provider: gemini
    model: gemini-3.8-flash
    thinking: medium
    max_tokens: 4000
  teacher:                  # dialogue realization: plays the assistant, with function calling
    provider: gemini
    model: gemini-3.8-flash
    thinking: high
    max_tokens: 16000         # 8000 was hit once (round 2); not part of the cache key
  embedding:                # query-pool dedup (near-duplicate detection)
    provider: gemini
    model: gemini-embedding-2
    dimensions: 768
  judge:                    # later: faithfulness / naturalness / query-purity judges
    provider: null          # pick a different model than generation when judges are built
    model: null

anthropic:
  fallbacks: null           # no silent model switching: a failed request fails loudly

# ---------------------------------------------------------------------------------------------------
# Other providers (Gemini stays the default). To use a vLLM server for a role, replace that role's block,
# e.g. (see README.md for the vLLM launch flags tool calling needs):
#
#   teacher:
#     provider: openai_compatible
#     base_url: http://localhost:8000/v1
#     model: Qwen/Qwen3-8B            # the name vLLM serves (--served-model-name, else the HF id)
#     max_tokens: 8000
#     api_key_env: VLLM_API_KEY       # optional: only if vLLM was started with --api-key
#     temperature: 0.7                # optional
#     reasoning_effort: low           # optional: models that support it (e.g. gpt-oss)
#     extra_body:                     # optional: passed through, e.g. Qwen3 thinking off
#       chat_template_kwargs: {enable_thinking: false}
#
#   embedding:
#     provider: openai_compatible     # vLLM (or any server with /v1/embeddings)
#     base_url: http://localhost:8001/v1
#     model: BAAI/bge-small-en-v1.5
#     dimensions: null                # set only if the served model supports matryoshka dimensions
#
#   embedding:
#     provider: local                 # in-process: pip install sentence-transformers
#     model: BAAI/bge-small-en-v1.5
#     device: cpu                     # optional: cpu / cuda / mps
#
# Changing a role's provider or model changes its cache keys, so that stage is regenerated.
