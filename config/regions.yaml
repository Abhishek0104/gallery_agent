# Per-region pools. Personas carry only `region`; everything regional is looked up here.
#   home_cities   — the LLM picks the persona's home city from this list
#   destinations  — typical trips (the LLM may add others); also part of the gazetteer
#   festivals     — for date hints ("during Diwali") in the spec sampler
#   date_phrases  — region-flavored date expressions for the spec sampler
#   names         — style guidance for the LLM (names may be non-English; all text stays English)
india:
  home_cities: [Bengaluru, Mumbai, Delhi, Pune, Hyderabad, Chennai, Kolkata, Jaipur, Kochi, Ahmedabad, Lucknow, Chandigarh]
  destinations: [Goa, Manali, Shimla, Mysuru, Ooty, Coorg, Munnar, Rishikesh, Udaipur, Leh, Darjeeling, Pondicherry, Varanasi, Andaman, Kashmir, Dubai, Singapore, Bali, Thailand, London]
  festivals: [Diwali, Holi, Onam, Pongal, Durga Puja, Ganesh Chaturthi, Navratri, Eid, Christmas, Raksha Bandhan, Lohri, Baisakhi]
  date_phrases: [last Diwali, during Holi, last Onam, this Navratri, last summer vacation, during the monsoon, last Christmas]
  names: "Indian names from varied states and communities (Hindi, Tamil, Bengali, Punjabi, Malayali, Marathi, Muslim, Christian); family nicknames are common"

