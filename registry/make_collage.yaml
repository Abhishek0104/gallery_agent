name: make_collage
model_facing:
  description: "Make a grid collage from {min}–{max} photos"
  args:
    images: {type: ImageSet, required: true}
pipeline:
  effect: write
  constraints:
    images.count: {min: 2, max: 9, randomize_max: [4, 6, 9, 12], config_key: collage_max, reject: too_many_images}
  io: {consumes: images, input: set, produces: single, count: one}   # needs a multi-image set; makes one image
  catalog: {short: collage}
  sample: {images: handle}
  spec_outcome: {status: created, count: 1}
  output:
    result: {status: created, collage: $out}
  conversation:
    outcome: "1 collage image ({out})"
    request: "Ask to make a collage of {images}."
    refers_to: "the collage"
    request_words: [collage, grid]
  errors:
    too_many_images: {expect: "ask the user to select at most {max}",
                      result: {error: too_many_images, max: $max}, flag: collage_outside_limits}
