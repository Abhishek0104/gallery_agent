name: search_images
model_facing:
  description: "Find photos by content, people, place, date"
  args:
    query:    {type: str}         # visual content → SigLIP
    people:   {type: "list[str]"} # "me" = owner; names, relations or named pets as spoken; AND across elements
    location: {type: str}         # raw phrase; reverse-geocoded
    date:     {type: str}         # raw phrase; app resolves
pipeline:
  effect: read
  io: {produces: set, count: outcome}          # a new photo set; its count comes from the spec outcome
  catalog:
    short: search                              # name in catalog path strings
    start: true                                # may open a conversation
    after: [search_images]                     # refinement: a search may directly follow a search ...
    max_per_path: 2                            # ... once
  sample: slot_filters                         # spec sampler: slot patterns + refinement (specs/strategies.py)
  spec_outcome: {count: $count}                # happy-path outcome written into the spec
  output:                                      # what the model sees ($out = new handle, $count = its count)
    result: {id: $out, count: $count}
    default_outcome: {count: 5}                # an unplanned call (the episode is flagged)
  outcomes:
    no_results: {when: {error: no_results}, result: {error: no_results}, produces: none, story: "no photos found"}
  conversation:
    outcome: "{count} photos ({out})"          # how the intent filler is told the result
    refers_to: "those photos"                  # how the user later refers to its photos
    request_words: [show, find, pull, photos, pictures, pics, see, look, search, get]   # cleanup must keep one
    # the request itself is built from the search slots (specs/strategies.py slot_filters, config/arg_types.yaml)
  errors:
    no_results: {expect: "say nothing was found, suggest loosening a filter; never invent results"}
