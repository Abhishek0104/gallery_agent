name: move_to_album
model_facing:
  description: "Move photos to an album (creates it if missing)"
  args:
    images: {type: ImageSet, required: true}   # rN handle
    album:  {type: str, required: true}        # as the user said it
pipeline:
  effect: write
  io: {consumes: images, produces: none, count: outcome_or_input}
  catalog: {short: move, terminal: true}       # nothing follows a move
  sample: {images: handle, album: album_fill}
  spec_outcome: {status: moved, count: $in_count, album: $arg.album, created: $created}
  output:
    result: {status: moved, count: $count, album: $arg.album, created: $created}
  conversation:
    outcome: "moved {count} ({created})"
    outcome_values: {created: {true: "new album created", false: "existing album"}}
    request:                                   # chosen by the spec outcome's `created`
      created: {true: "Ask to move {images} to a new album called \"{album}\".",
                false: "Ask to move {images} to your album \"{album}\"."}
    required: [album]
    request_without:
      album: {text: "Ask to move {images} into an album, but don't say which album.", forbid: value}
    request_words: [move, album, put, add, file, save]
  errors: {}
